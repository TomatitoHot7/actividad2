<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Hola! xd</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>¡Hola!</h1>
        <p>¿Cómo te llamás?</p>
        
        <form id="nameForm">
            <input type="text" id="nombreInput" placeholder="Tu nombre aquí" required autocomplete="off">
            <br>
            <button type="submit">Enviar</button>
        </form>

        <h2 id="saludoResultado"></h2>
    </div>

    <div id="easterEggOverlay" class="overlay hidden">
        <img id="easterEggImage" src="tu-imagen.gif" alt="Easter Egg">
        <p>Presiona en cualquier lugar para cerrar</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
